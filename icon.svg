<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景角丸スクワークル -->
  <rect x="8" y="8" width="176" height="176" rx="42" fill="url(#bgGrad)" />

  <!-- 電球の光（放射グロー） -->
  <g stroke="#fef3c7" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <!-- 上 -->
    <line x1="96" y1="36" x2="96" y2="26"/>
    <!-- 左上 -->
    <line x1="53" y1="53" x2="45" y2="45"/>
    <!-- 右上 -->
    <line x1="139" y1="53" x2="147" y2="45"/>
    <!-- 左 -->
    <line x1="36" y1="90" x2="26" y2="90"/>
    <!-- 右 -->
    <line x1="156" y1="90" x2="166" y2="90"/>
  </g>

  <!-- 電球本体（ホワイト） -->
  <path d="M96 46 C74 46 56 64 56 86 C56 101 64 112 74 122 L74 132 C74 135 77 138 80 138 L112 138 C115 138 118 135 118 132 L118 122 C128 112 136 101 136 86 C136 64 118 46 96 46 Z" 
        fill="#ffffff" 
        filter="url(#glow)"/>

  <!-- ソケット（口金）部分 -->
  <path d="M80 144 L112 144 C114 144 116 146 116 148 C116 150 114 152 112 152 L80 152 C78 152 76 150 76 148 C76 146 78 144 80 144 Z" fill="#fef3c7"/>
  <path d="M84 156 L108 156 C110 156 112 158 112 160 C110 163 104 166 96 166 C88 166 82 163 80 160 C80 158 82 156 84 156 Z" fill="#fef3c7"/>

  <!-- 電球内部のフィラメント（ひらめきの核） -->
  <path d="M86 96 L91 76 L101 76 L106 96" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="96" y1="76" x2="96" y2="94" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
</svg>
